services:
  backend:
    build:
      context: backend
    container_name: backend
    working_dir: /usr/src/app
    networks:
      - backend-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    ports:
      - "3000:3000"
    command: yarn run start

  frontend:
    build:
      context: frontend
    container_name: frontend
    working_dir: /usr/src/app
    networks:
      - backend-network
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    ports:
      - "5173:5173"
    command: yarn run dev

  server:
    build:
      context: server
    container_name: server
    restart: always
    tty: true
    ports:
      - "8000:80"
    networks:
      - backend-network
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

networks:
  backend-network:
    driver: bridge
